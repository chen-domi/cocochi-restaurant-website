services:
  postgres:
    image: postgres:16
    container_name: cocochi-postgres
    environment:
      POSTGRES_DB:       ${DB_NAME:-cocochi}
      POSTGRES_USER:     ${DB_USER:-cocochi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cocochi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cocochi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cocochi-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-cocochi}
      DB_USER:     ${DB_USER:-cocochi}
      DB_PASSWORD: ${DB_PASSWORD:-cocochi}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
